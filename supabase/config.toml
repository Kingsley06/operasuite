# For full config reference see: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Webhook receivers are called by Meta, not by a logged-in Supabase user —
# they can't send a Supabase JWT, so JWT verification is disabled and each
# function authenticates the request itself (verify-token handshake on GET,
# X-Hub-Signature-256 HMAC check on POST).
[functions.whatsapp-webhook]
verify_jwt = false

[functions.instagram-webhook]
verify_jwt = false

[functions.messenger-webhook]
verify_jwt = false
